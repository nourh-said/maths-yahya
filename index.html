<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة النجم يحي في كواكب الرياضيات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e0;--card:#fff;--ink:#2b2250;--pri:#7c4dff;--ok:#1fae6b;--no:#f0613a;--gold:#ffb300;--soft:#efe9ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171335;--card:#241d4d;--ink:#f6f1ff;--soft:#34296b}}
:root[data-theme="dark"]{--bg:#171335;--card:#241d4d;--ink:#f6f1ff;--soft:#34296b}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:20px;display:flex;justify-content:center}
#app{width:100%;max-width:640px;padding:16px}
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 6px 0 rgba(124,77,255,.25);text-align:center}
h1{font-size:30px;margin:6px 0}.big{font-size:84px;line-height:1;animation:b 2s infinite}
@keyframes b{50%{transform:translateY(-10px) rotate(6deg)}}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 18px;color:var(--ink);background:var(--soft);width:100%;margin:7px 0;font-weight:700;transition:transform .1s}
button:active{transform:scale(.97)}
.go{background:var(--pri);color:#fff;font-size:22px}
.planet{display:flex;align-items:center;gap:12px;text-align:right}.planet span{font-size:42px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.bar{height:14px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.q{font-size:25px;margin:14px 0;line-height:1.7;direction:rtl}
.ok{background:var(--ok)!important;color:#fff}.no{background:var(--no)!important;color:#fff}
.msg{min-height:80px;margin:10px 0;padding:12px;border-radius:18px;background:var(--soft);text-align:right}
.pop{animation:p .4s}@keyframes p{50%{transform:scale(1.06)}}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}.fx b{position:absolute;top:-40px;font-size:30px;animation:f 2.2s linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body><div id="app"></div>
<script>
const TF=["صح ✓","خطأ ✗"];
// [كوكب, سؤال, خيارات, الإجابة, تفسير]
const Q=[
[0,"قيمة الرقم 7 في العدد 45.72 هي 0.7",TF,0,"7 في خانة الأجزاء من عشرة، أي 0.7"],
[0,"الكسر العشري 0.05 يُقرأ: خمسة أجزاء من عشرة",TF,1,"الصواب: خمسة أجزاء من مائة"],
[0,"عند ضرب العدد 0.3 × 0.2 يكون الناتج 0.6",TF,1,"3 × 2 = 6، وبعد خانتين عشريتين = 0.06"],
[0,"القسمة على 0.1 تعادل الضرب في 10",TF,0,"أحسنت! القسمة على 0.1 تُكبّر العدد 10 أضعاف"],
[0,"القيمة المكانية للرقم 5 في العدد 3.258 هي:",["أجزاء من عشرة","أجزاء من مائة","أجزاء من ألف","آحاد"],1,"الرقم 5 في الخانة الثانية بعد الفاصلة"],
[0,"54.2 × 10 = ؟",["0.542","5,420","542","5.42"],2,"الضرب في 10 ينقل الفاصلة خانة لليمين"],
[0,"0.3 × 0.4 = ؟",["1.2","0.12","0.012","12"],1,"3 × 4 = 12، وبعد خانتين عشريتين = 0.12"],
[0,"1 − 0.45 = ؟",["1.45","0.45","0.65","0.55"],3,"100 − 45 = 55 جزءًا من مائة"],
[0,"3 لترات و 250 ملليلتر = كم ملليلترًا؟",["3.25","32,500","3,250","325"],2,"3 × 1000 + 250 = 3,250"],
[0,"3.6 ÷ 6 = ؟",["60","0.06","0.6","6"],2,"36 ÷ 6 = 6، فالناتج 0.6"],
[1,"العدد الأولي هو عدد له عاملان فقط: الواحد والعدد نفسه",TF,0,"تعريف رائع حفظته!"],
[1,"أصغر عدد أولي فردي هو 1",TF,1,"الصواب 3؛ لأن العدد 1 ليس أوليًا"],
[1,"العدد 9 عدد أولي لأنه فردي",TF,1,"9 = 3 × 3 فهو متعدد العوامل"],
[1,"المضاعف المشترك الأصغر للعددين 4 و 6 هو 12",TF,0,"مضاعفات 4: 4، 8، 12 ... ومضاعفات 6: 6، 12 ✓"],
[1,"أي الأعداد الآتية عدد أولي؟",["15","11","9","1"],1,"11 لا يقبل القسمة إلا على 1 ونفسه"],
[1,"العامل المشترك الأكبر للعددين 12 و 18 هو:",["36","6","3","2"],1,"عوامل 12 و18 المشتركة: 1، 2، 3، 6 وأكبرها 6"],
[1,"المضاعف المشترك الأصغر للعددين 6 و 9 هو:",["54","27","18","3"],2,"مضاعفات 9: 9، 18 ← 18 تقبل القسمة على 6"],
[1,"أصغر عدد أولي فردي هو:",["7","5","3","1"],2,"2 هو الأولي الزوجي، وبعده 3"],
[1,"عدد أولي مجموع عوامله 8 هو:",["3","5","7","9"],2,"عوامل 7: 1 و 7 ومجموعهما 8"],
[1,"العدد 15 من مضاعفات العدد:",["4","2","7","5"],3,"15 = 5 × 3"],
[2,"في التعبير 5 + 3 × 2 نجري عملية الجمع أولًا",TF,1,"الضرب أولًا: 3 × 2 = 6 ثم 5 + 6 = 11"],
[2,"7 لترات تعادل 700 ملليلتر",TF,1,"7 لترات = 7,000 ملليلتر"],
[2,"24 × 100 = 240",TF,1,"الناتج 2,400"],
[2,"10 + 4 × 2 = ؟",["16","24","18","28"],2,"4 × 2 = 8 ثم 10 + 8 = 18"],
[2,"40 × 50 = ؟",["200","2,000","20,000","20"],1,"4 × 5 = 20 ثم نضيف صفرين"],
[2,"20 − (5 + 3) = ؟",["28","8","18","12"],3,"الأقواس أولًا: 8، ثم 20 − 8 = 12"],
[2,"في المعادلة x − 2.5 = 4 فإن x تساوي:",["2.5","6","6.5","1.5"],2,"x = 4 + 2.5 = 6.5"],
[2,"في المعادلة x = 8.5 − 3.5 تكون x:",["5.5","4.5","12","5"],3,"8.5 − 3.5 = 5"],
[2,"باقي قسمة 47 ÷ 5 هو:",["4","3","2","1"],2,"5 × 9 = 45 والباقي 2"],
[2,"أي األعداد الآتية من مضاعفات العدد 7؟".replace("األ","الأ"),["45","35","27","17"],1,"7 × 5 = 35"]
];
const P=[["🪐","كوكب الكسور العشرية","ضرب وقسمة وطرح الأعداد العشرية"],["🌟","كوكب الأعداد الأولية","أولي، ع.م.أ ، م.م.أ"],["🚀","كوكب العمليات والمعادلات","ترتيب العمليات والمعادلات"]];
const good=["أحسنت يا نجم! 🌟","رائع يا يحي! أنت بطل! 🏆","إجابة ممتازة! عقلك يلمع! ✨","يا سلام! عبقري الرياضيات! 🎉","مذهل! واصل التقدم! 🚀"];
const bad=["لا بأس يا يحي، المحاولة تصنع الأبطال! 💪","قريب جدًا! ستُصيب في السؤال القادم 🌈","كل نجم كبير أخطأ ثم تعلّم، أنت قادر! ⭐","لا تحزن، تعلّمنا شيئًا جديدًا! 😊"];
const app=document.getElementById("app");
let st={},cur=[],i=0,score=0,streak=0,planet=0,done=false;
const r=a=>a[Math.floor(Math.random()*a.length)];
function home(){
 const total=st.stars||0;
 app.innerHTML=`<div class="card"><div class="big">🦉</div><h1>مرحبًا يا نجمنا يحي! ⭐</h1>
 <p>أنا بومة الحكمة، وسأرافقك في رحلة بين كواكب الرياضيات. اجمع النجوم واكسب لقب «بطل الرياضيات»!</p>
 <p>⭐ نجومك حتى الآن: <b>${total}</b></p>
 ${P.map((p,k)=>`<button class="planet" onclick="start(${k})"><span>${p[0]}</span><div>${p[1]}<br><small>${p[2]}</small></div></button>`).join("")}</div>`;
}
function start(k){planet=k;cur=Q.filter(q=>q[0]==k).sort(()=>Math.random()-.5).slice(0,8);i=0;score=0;streak=0;show()}
function show(){
 const q=cur[i];
 app.innerHTML=`<div class="card"><div class="top"><span>${P[planet][0]} ${P[planet][1]}</span><span>⭐ ${score}</span></div>
 <div class="bar"><i style="width:${i/cur.length*100}%"></i></div>
 <div class="q">${q[1]}</div>
 ${q[2].map((o,k)=>`<button onclick="pick(${k},this)">${o}</button>`).join("")}
 <div class="msg" id="m">🦉 فكّر جيدًا يا يحي، أنا واثقة بك! ${streak>1?"🔥 "+streak+" إجابات صحيحة متتالية":""}</div></div>`;
}
function pick(k,el){
 const q=cur[i],bs=[...document.querySelectorAll("button")];bs.forEach(b=>b.disabled=true);
 const m=document.getElementById("m");
 if(k==q[3]){el.classList.add("ok","pop");score++;streak++;m.innerHTML="🦉 "+r(good)+"<br><small>"+q[4]+"</small>";fx("⭐")}
 else{el.classList.add("no");bs[q[3]].classList.add("ok");streak=0;m.innerHTML="🦉 "+r(bad)+"<br><small>الصحيح: "+q[2][q[3]]+" — "+q[4]+"</small>"}
 m.insertAdjacentHTML("afterend",`<button class="go" onclick="next()">${i==cur.length-1?"النتيجة 🎁":"التالي ←"}</button>`);
}
function next(){i++;i<cur.length?show():end()}
function end(){
 st.stars=(st.stars||0)+score;const p=score/cur.length;
 const t=p==1?["👑","بطل الرياضيات الخارق!","درجة كاملة! أنا فخورة بك جدًا يا يحي!"]:p>=.6?["🏆","نجم متألق!","أداء رائع! قليل من التدريب ويصبح كل شيء مثاليًا."]:["🌱","نجم صاعد!","بدايتك جميلة، وكل محاولة تجعلك أذكى. أعد الكوكب وسترى الفرق!"];
 fx("🎉");fx("⭐");
 app.innerHTML=`<div class="card"><div class="big">${t[0]}</div><h1>${t[1]}</h1><p>${t[2]}</p>
 <h2>حصلت على ${score} من ${cur.length} ⭐</h2>
 <button class="go" onclick="start(${planet})">🔁 العب الكوكب مرة أخرى</button>
 <button onclick="home()">🏠 اختر كوكبًا آخر</button></div>`;
}
function fx(e){for(let n=0;n<14;n++){const b=document.createElement("div");b.className="fx";b.innerHTML=`<b style="right:${Math.random()*95}%;animation-delay:${Math.random()*.6}s">${e}</b>`;document.body.appendChild(b);setTimeout(()=>b.remove(),3200)}}
home();
</script></body></html>
